# Not a package. Nothing here is importable as a library and there is no build
# backend, because every file in this repository is an independently invoked
# leaf and pretending otherwise would be a fiction for the benefit of tooling.
#
# What this file is for is the one real gap requirements.txt left: it declares
# the probe dependencies, so the measurement layer has a documented install path.
#
#   make setup                               the probes, the guards, pytest and ruff
#   pip install -r requirements.txt          the same by hand, then pytest pytest-cov ruff
#
# `pip install '.[dev]'` does NOT work here and this comment used to say it did:
# there is no build backend, so pip fails before installing anything. The dev
# extra below is kept as the declaration of what CI installs, and `make setup`
# is the path that installs it.
#
# ffmpeg and ffprobe are required by both halves and cannot be expressed here.
# They are system binaries; install them with your package manager.

[project]
name = "autonomous-ads-pipeline-multimodal-evals"
version = "0.1.0"
description = "Three-tier eval harness (process, outcome, quality) for agentic AI-generated video ads"
requires-python = ">=3.10"

# Versions are the ones this was actually run against, not the minimum that might
# work. Nothing is pinned exactly, because the APIs used here (VideoCapture,
# absdiff, matchTemplate, ndarray math) have been stable for years and an exact
# pin would age worse than the code does.
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

# The two gates that locate a face. Their imports are lazy, so every gate LOADS without these and
# the verdict rules stay testable anywhere; measuring a real clip needs them.
face = [
    "insightface>=0.7",
    "mediapipe>=0.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The repo already carries `# noqa` markers, which means a linter was being run
# somewhere without its configuration living alongside the code. This is that
# configuration, so the markers now refer to rules a reader can look up.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length, the repo sets its own at 100 and long measurement lines are clearer whole
    "B008",
    # The style rules below are deliberate here and are not defects. The probes and gates are
    # written as dense one-line measurements on purpose, and this linter exists to catch what
    # breaks at runtime, not to relayout a working measurement layer (2026-09-21).
    "E701",   # if x: return, the compact form these files use throughout
    "E702",   # a; b on one line, same
    "E401",   # import json, sys on one line
    "E741",   # l for landmark, I for image, in numeric code where the short name IS the name
    "I001",   # import order, not enforced retroactively across a working tree
]

# Coverage. parallel plus COVERAGE_PROCESS_START is what makes the number honest here: the gates
# and probes are invoked as subprocesses by their tests, and without it they all read 0% while
# being thoroughly exercised. The floor only ratchets up.
[tool.coverage.run]
parallel = true
source = ["probes", "gates", "evals", "tools"]

[tool.coverage.report]
show_missing = false
precision = 0
