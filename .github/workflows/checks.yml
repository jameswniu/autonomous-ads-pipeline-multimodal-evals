# Runs the repo's own claims against the repo.
#
# The existing pii-scan workflow guards what goes OUT. This one guards what is
# ASSERTED: that the thresholds trace to labelled exemplars, that the labelled
# pixels are actually here, and that nothing announces failure while exiting 0.
#
# It fails the build if a threshold drifts outside its own bracket. That is the
# point. A derivation nobody re-runs decays into a number somebody typed.
name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          # The ledger tests rebuild immutable rows from the commit that wrote
          # races.jsonl. A shallow checkout cannot name that commit, so they would
          # fall back to today's files and fail on the first unrelated doc edit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every probe shells out to ffmpeg/ffprobe. requirements.txt cannot express
      # that, and its absence is why a probe "returns no data" instead of failing.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # A fresh clone must be able to import every probe. This catches an
      # undeclared dependency, which is how Pillow stayed missing from
      # requirements.txt while eight files imported it.
      - name: Import every probe
        run: |
          set -e
          for f in probes/*.py; do
            python -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('p', '$f')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          " || { echo "FAILED TO IMPORT: $f"; exit 1; }
          done
          echo "all probes import"

      - name: Derive thresholds from the labelled exemplars
        run: python3 evals/derive.py
      - name: Test suite
        run: python3 -m pytest tests/ -v
      # One committed board through the graph in dry mode, the way a stranger runs it with no keys.
      # The board gate runs for real, the run writes the four scene requests a live run would send
      # and what they would cost, and it stops before the first spend. Its ledger has to match the
      # pinned one. The run id, the times and the request ids are new on every run, so
      # pipeline.ledger prints each of them as its own name before the diff.
      - name: Dry run through the graph
        run: |
          set -eo pipefail
          python3 -m pipeline.run --board shoots/graph-zai-shots/boards.json --spot zai --mode dry --run-dir "$RUNNER_TEMP/dry"
          python3 -m pipeline.ledger "$RUNNER_TEMP/dry/ledger.jsonl" | diff pipeline/expected/dry-zai-shots.txt -
      # The one executable test that predates this workflow. It used to fail on a
      # fresh clone because it asserts on a string only emitted when
      # learned_rules.md exists, and that file was never committed. It is now
      # shipped, so this blocks like everything else.
      - name: Prop gate selftest
        run: bash guards/prop_gate.sh selftest
      # The kill gate is standard library only. Its scripts must print exactly what
      # eval/expected/ records, so a change to the votes, scores or math fails here.
      - name: Kill gate
        working-directory: kill-gate
        run: |
          set -eo pipefail
          python3 test_gate.py
          python3 eval/run.py | diff eval/expected/run.txt -
          python3 eval/run.py --cohort all | diff eval/expected/run-cohort-all.txt -
          python3 eval/run.py --judge gpt | diff eval/expected/run-judge-gpt.txt -
          python3 eval/facts.py | diff eval/expected/facts.txt -
