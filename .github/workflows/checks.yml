# Runs the repo's own claims against the repo.
#
# The existing pii-scan workflow guards what goes OUT. This one guards what is
# ASSERTED: that the thresholds trace to labelled exemplars, that the labelled
# pixels are actually here, and that nothing announces failure while exiting 0.
#
# It fails the build if a threshold drifts outside its own bracket. That is the
# point. A derivation nobody re-runs decays into a number somebody typed.
name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          # The ledger tests rebuild immutable rows from the commit that wrote
          # races.jsonl. A shallow checkout cannot name that commit, so they would
          # fall back to today's files and fail on the first unrelated doc edit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every probe shells out to ffmpeg/ffprobe. requirements.txt cannot express
      # that, and its absence is why a probe "returns no data" instead of failing.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      # A fresh clone must be able to import every probe AND every gate. This catches an
      # undeclared dependency, which is how Pillow stayed missing from
      # requirements.txt while eight files imported it. gates/ was added on 2026-09-21,
      # when a sweep found that nothing in CI had ever loaded those eight files: one read
      # sys.argv at import time and two imported model libraries nothing declared.
      - name: Import every probe and gate
        run: |
          set -e
          for f in probes/*.py gates/*.py; do
            python -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('p', '$f')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          " || { echo "FAILED TO IMPORT: $f"; exit 1; }
          done
          echo "all probes import"

      # The calibration report. Whoever opens a run sees, without cloning anything, which
      # thresholds are derived, which are typed, which their own labels refuse, and how many
      # labels were re-measured from pixels against re-read from a committed shipping ledger.
      # This is the maintenance answer made visible rather than asserted.
      - name: Derive thresholds from the labelled exemplars
        run: |
          set -o pipefail
          {
            echo "### Threshold calibration"
            echo
            echo '```'
            python3 evals/derive.py | tee /tmp/derive.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E 'NAMED gating thresholds|AUTHORED|REFUTED|labelled rows' /tmp/derive.txt || true

      # Every selftest the repository already ships. script_match's has existed since
      # 2026-07-26 and nothing ever called it.
      - name: Gate selftests
        run: bash gates/script_match.sh --selftest

      # Can the lip-sync probes still measure a shift at all? A known dose goes in, the reading
      # comes back, and the fit says whether the needle moves one for one and how tightly. A
      # probe that has gone blind fails here rather than passing everything downstream.
      - name: Certify the probes against a known shift
        run: |
          set -o pipefail
          {
            echo "### Instrument certificate"
            echo
            echo '```'
            python3 evals/certify.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: ruff check .

      # COVERAGE_PROCESS_START is what makes this number honest. The gates and probes are
      # invoked as subprocesses by their tests, and without it every one of them reads 0%
      # while being thoroughly exercised: 27% against the real 54%.
      - name: Test suite with coverage
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: |
          python3 -m pytest tests/ -v --cov --cov-report=
          python3 -m coverage report
          {
            echo "### Coverage"
            echo
            echo '```'
            python3 -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A subprocess killed mid-write leaves a torn data file, which coverage warns about
          # and skips. tests/test_races.py kills a child with SIGXFSZ on purpose, so expect it.
          # The floor ratchets. It sits just under the measured 54% so an environment
          # difference cannot flap the build, and it rises with each test added.
          python3 -m coverage report --fail-under=50
      # The one executable test that predates this workflow. It used to fail on a
      # fresh clone because it asserts on a string only emitted when
      # learned_rules.md exists, and that file was never committed. It is now
      # shipped, so this blocks like everything else.
      - name: Prop gate selftest
        run: bash guards/prop_gate.sh selftest

      # The report is a claim like any other, so it is checked rather than assumed. A
      # redirect that silently goes nowhere leaves a green run whose summary is empty,
      # and the only way to notice would be for a human to open the page and look.
      - name: The job summary actually has the report in it
        run: |
          for want in "Threshold calibration" "Instrument certificate" "NAMED gating thresholds" "TRACKS slope" "Coverage"; do
            grep -qF "$want" "$GITHUB_STEP_SUMMARY" || { echo "summary is missing: $want"; exit 1; }
          done
          echo "summary carries every section, $(wc -c < "$GITHUB_STEP_SUMMARY") bytes"
